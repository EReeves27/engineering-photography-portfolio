# Build Vite app and deploy dist/ to GitHub Pages.
# Repo Settings → Pages → Source: "GitHub Actions"
# Optional: Settings → Secrets and variables → Actions (repo level, not Environments)
#   Secret or Variable: VITE_SPOTIFY_RECENT_URL
#   Value: https://eng-spotify-vinyl.ethanhreeves.workers.dev/recent

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SPOTIFY_RECENT_URL: ${{ secrets.VITE_SPOTIFY_RECENT_URL || vars.VITE_SPOTIFY_RECENT_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
