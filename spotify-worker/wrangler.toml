name = "eng-spotify-vinyl"
main = "src/index.js"
compatibility_date = "2024-08-01"

# Comma-separated browser origins (scheme + host only — no repo path, no trailing slash).
[vars]
ALLOWED_ORIGINS = "https://ereeves27.github.io,http://localhost:5173"

# Persists rotated refresh tokens when Spotify returns a new one on refresh.
[[kv_namespaces]]
binding = "SPOTIFY_KV"
id = "ce1fa040840b4e14ad65a47359ad10a2"
